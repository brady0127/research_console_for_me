<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Console</title>
  <meta name="description" content="Personal research console: tracked papers with analysis reports and research-community briefings.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/atom+xml" title="Papers" href="feeds/papers.xml">
  <link rel="alternate" type="application/atom+xml" title="Briefings" href="feeds/news.xml">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("rc.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 19V5m0 14h16M8 15l3.5-4 3 2.5L20 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text">Research Console</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-4H4zm10-11h6V4h-6z"/></svg><span>Overview</span></a>
        <a href="#/papers" data-route="papers"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6m-6 4h6"/></svg><span>Papers</span><b class="nav-count" id="nav-unread" hidden></b></a>
        <a href="#/search" data-route="search"><svg viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm9 3-4.3-4.3"/></svg><span>Search</span></a>
        <a href="#/news" data-route="news"><svg viewBox="0 0 24 24"><path d="M5 5h11v14H6a1 1 0 0 1-1-1zm11 4h3v9a1 1 0 0 1-1 1h-2M8 9h5m-5 4h5m-5 4h3"/></svg><span>News</span></a>
        <a href="#/tracks" data-route="tracks"><svg viewBox="0 0 24 24"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Tracks</span></a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.3l2-1.6-2-3.4-2.4.9a7.5 7.5 0 0 0-2.2-1.3L14.3 2h-4l-.4 2.6a7.5 7.5 0 0 0-2.2 1.3l-2.4-1-2 3.5 2 1.6a7.4 7.4 0 0 0 0 2.6l-2 1.6 2 3.4 2.4-.9a7.5 7.5 0 0 0 2.2 1.3l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 2.2-1.3l2.4.9 2-3.4-2-1.6c.1-.4.1-.9.1-1.3z"/></svg><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme" title="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
        <div class="status-line" id="status-line">Loading…</div>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/venues.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
