name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "config/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the branch head (not the triggering SHA) so a deploy called right
      # after the data commit publishes that commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Copy configuration into the site
        run: |
          mkdir -p site/data/config
          cp config/tracks.json config/venues.json config/news_sources.json config/settings.json site/data/config/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
