name: Update research console

on:
  schedule:
    # Daily at 01:37 UTC (09:37 in Beijing), shortly after arXiv's daily announcement.
    # The news job runs on the same schedule but only publishes when a briefing is due
    # (every `news.cadence_days` days, see config/settings.json).
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [all, papers, news]
        default: all
      force_news:
        description: "Publish a news briefing even if one is not due"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: research-console-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          JOB: ${{ inputs.job || 'all' }}
          FORCE_NEWS: ${{ inputs.force_news || false }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: |
          args=()
          if [ "$JOB" != "all" ]; then args+=(--only "$JOB"); fi
          if [ "$FORCE_NEWS" = "true" ]; then args+=(--force-news); fi
          python -m console run "${args[@]}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feeds state
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          # Tracks may have been edited from the console while this run was in progress.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
